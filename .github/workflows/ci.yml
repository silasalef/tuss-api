name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks olha o histórico inteiro

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Formatação
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest

      - name: Vulnerabilidades nas dependências
        run: uv export --no-hashes --no-emit-project --format requirements-txt > requirements.txt && uv run pip-audit -r requirements.txt

      - name: Segredos no repositório
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
