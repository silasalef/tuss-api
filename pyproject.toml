[project]
name = "tuss"
version = "0.1.0"
description = "API de consulta às tabelas TUSS (ANS) com histórico de versões e vigência por data"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
tuss = "tuss.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F/W: erros básicos; I: imports; B: bugs comuns; UP: sintaxe moderna; S: segurança (bandit); DTZ: datas sem fuso
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Em teste: assert é o normal; SQL e senhas são valores fixos e fictícios, não entrada de usuário
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integracao: usa Postgres real via Docker (testcontainers)"]
