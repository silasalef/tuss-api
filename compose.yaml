# Serviços do tuss-api: banco, API, worker (coleta diária) e CLI.
#
# Uso:
#   cp .env.example .env   # e troque as senhas
#   docker compose up -d --build                          # sobe o banco, a API e o worker
#   docker compose run --rm --build tuss alembic upgrade head   # aplica as migrations
#   docker compose run --rm tuss tuss importar /dados/arquivo.json  # arquivo em ./dados
#   docker compose run --rm tuss tuss --help              # qualquer comando do CLI
#   docker compose exec postgres psql -U tuss             # abrir o banco
#
# Regras (ver docs/PLANEJAMENTO.md):
# - o banco não publica porta; a API só em 127.0.0.1 (acesso por túnel SSH);
# - limite de memória, para uma importação pesada não afetar outros serviços do servidor.

name: tuss-api

services:
  postgres:
    image: postgres:18-alpine # tem versão arm64; traz pg_trgm, unaccent e btree_gist
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuss
      POSTGRES_USER: tuss # dono do banco: usado só nas migrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # Ajustes para um servidor pequeno e compartilhado (o padrão do Postgres supõe máquina dedicada)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql # a partir do Postgres 18 o volume é montado aqui, não em .../data
    # 1 GB: com as tabelas 19 e 64 (3 milhões de conceitos), cargas e migrations grandes
    # passaram de 512 MB e o processo foi encerrado por falta de memória.
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuss -d tuss"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m # evita que o log encha o disco
        max-file: "3"

  # API de leitura. Só em 127.0.0.1 da VPS: de fora, apenas por túnel SSH
  # (ssh -L 8100:localhost:8100 ...). Conecta com o papel `api`, que só lê.
  api:
    build: .
    image: tuss-api:local
    restart: unless-stopped
    command:
      - uvicorn
      - tuss.api.app:criar_app
      - --factory
      - --host=0.0.0.0 # dentro do container; a porta publicada abaixo é só local
      - --port=8000
      - --no-server-header
      - --no-access-log # a própria API registra cada requisição (JSON, com request_id)
    environment:
      TUSS_DB_SENHA_API: ${TUSS_DB_SENHA_API:?defina TUSS_DB_SENHA_API no .env}
      TUSS_API_TOKENS_SHA256: ${TUSS_API_TOKENS_SHA256:?defina TUSS_API_TOKENS_SHA256 no .env (gere com tuss token)}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Coleta diária pela API da ANS (3 h em Brasília). Conecta com o papel `ingestao`.
  # Nenhuma porta: só faz requisições para fora (ANS e heartbeat).
  worker:
    build: .
    image: tuss-api:local
    restart: unless-stopped
    command: ["tuss", "worker"]
    environment:
      TUSS_DB_SENHA_INGESTAO: ${TUSS_DB_SENHA_INGESTAO:?defina TUSS_DB_SENHA_INGESTAO no .env}
      TUSS_HEARTBEAT_URL: ${TUSS_HEARTBEAT_URL:-}
    volumes:
      - snapshots:/var/lib/tuss/snapshots # cada página recebida da ANS, como veio
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s # tempo para registrar a parada; coleta completa retoma depois
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Incremental das tabelas gigantes (19 e 64), o tempo todo, em trechos de 20 páginas
  # (src/tuss/recuperacao.py). Passa quase todo o tempo esperando a ANS: pouca CPU e
  # memória, mas com limite para não pesar na VPS.
  recuperacao:
    build: .
    image: tuss-api:local
    restart: unless-stopped
    command: ["tuss", "recuperar"]
    environment:
      TUSS_DB_SENHA_INGESTAO: ${TUSS_DB_SENHA_INGESTAO:?defina TUSS_DB_SENHA_INGESTAO no .env}
      TUSS_HEARTBEAT_RECUPERACAO_URL: ${TUSS_HEARTBEAT_RECUPERACAO_URL:-}
    volumes:
      - snapshots:/var/lib/tuss/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # CLI e migrations. Não sobe com `up`: só roda quando chamado com `docker compose run`.
  tuss:
    build: .
    image: tuss-api:local
    profiles: [cli]
    environment:
      TUSS_DB_SENHA_DONO: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TUSS_DB_SENHA_INGESTAO: ${TUSS_DB_SENHA_INGESTAO:?defina TUSS_DB_SENHA_INGESTAO no .env}
      TUSS_DB_SENHA_API: ${TUSS_DB_SENHA_API:?defina TUSS_DB_SENHA_API no .env}
    volumes:
      - ./dados:/dados:ro # arquivos baixados do portal (só leitura)
      - snapshots:/var/lib/tuss/snapshots # cópia de cada arquivo importado
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    read_only: true # o container não altera os próprios arquivos
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  snapshots:
