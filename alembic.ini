# Migrations do banco (Alembic). Rodar com o dono do banco:
#   docker compose run --rm tuss alembic upgrade head
# O endereço do banco vem das variáveis TUSS_DB_* (ver src/tuss/config.py).

[alembic]
script_location = %(here)s/src/tuss/db/migrations
# Nome legível e importável: `alembic revision --rev-id 0002 -m "..."` gera v0002_....py
file_template = v%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# WARNING de propósito: em INFO o SQL apareceria no log, inclusive o CREATE ROLE com senha
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
